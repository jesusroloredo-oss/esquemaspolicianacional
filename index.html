<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquemas Policía Nacional</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-align: center;
        }
        p {
            color: #666;
            margin-bottom: 40px;
        }
        .grid-temas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .btn-tema {
            background-color: #ffffff;
            color: #1e3a8a;
            text-decoration: none;
            padding: 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-tema:hover {
            transform: translateY(-4px);
            border-color: #1e3a8a;
            box-shadow: 0 10px 15px rgba(30, 58, 138, 0.1);
            background-color: #f8fafc;
        }
        .badge {
            background-color: #1e3a8a;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>👮 Esquemas Policía Nacional</h1>
    <p>Selecciona el tema que deseas estudiar:</p>

    <div class="grid-temas">
        <a href="tema1.html" class="btn-tema">
            <span>Tema 1: El Derecho</span>
            <span class="badge">Disponible</span>
        </a>

        <a href="#" class="btn-tema" style="opacity: 0.6; cursor: not-allowed;">
            <span>Tema 2: Derecho Constitucional</span>
            <span class="badge" style="background-color: #64748b;">Próximamente</span>
        </a>
    </div>

</body>
</html>
